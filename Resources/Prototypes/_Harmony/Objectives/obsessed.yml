- type: entity
  abstract: true
  parent: BaseObjective
  id: BaseObsessedObjective
  components:
  - type: Objective
    issuer: obsessed-objective-issuer
    difficulty: 1 # 3 objectives
  - type: RoleRequirement
    roles:
    - ObsessedRole

- type: entity
  parent: BaseObsessedObjective
  id: ObsessedPhotoObjective
  description: Use the camera you brought to keep a few moments forever frozen in time. These photos must be taken at least five minutes apart.
  components:
  - type: Objective
    icon:
      sprite: Objects/Devices/travel_camera.rsi
      state: icon
  - type: NumberObjective
    min: 4
    max: 6
    title: objective-condition-photos-title
  - type: PhotographCondition

- type: entity
  parent: BaseObsessedObjective
  id: ObsessedIsolationObjective
  name: Kill all of your obsession's co-workers
  description: Their co-workers are only getting in the way between you and them. Take them all out of the picture, and make sure they aren't coming back.
  components:
  - type: Objective
    icon:
      sprite: Objects/Weapons/Grenades/clusterbomb.rsi
      state: icon
  - type: IsolateObsessionCondition

- type: entity
  parent: BaseObsessedObjective
  id: ObsessedStealIdObjective
  name: Steal your obsession's ID
  description: Their ID card is special to them. Make it yours as well.
  components:
  - type: Objective
    icon:
      sprite: Objects/Misc/id_cards.rsi
      state: default
  - type: StealObsessionIdCardCondition

- type: entity
  parent: BaseObsessedObjective
  id: ObsessedAwaitConclusionObjective
  description: You haven't quite decided what you will do to them yet. Keep your options open until you've completed the rest of your objectives.
  components:
  - type: Objective
    icon:
      sprite: Objectives/Specific/Medical/firstaidkits.rsi
      state: advkit
  - type: TargetObjective
    title: obsessed-pending-objective-title
  - type: PickObsession
  - type: KeepAliveCondition

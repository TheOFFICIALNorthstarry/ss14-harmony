- type: entity
  parent: BaseGameRule
  id: BloodBrothers
  components:
  - type: GameRule
    minPlayers: 10
    cancelPresetOnTooFewPlayers: false
    delay:
      min: 240
      max: 420
  - type: BloodBrotherRule
  - type: AntagRandomObjectives
    sets:
    - groups: BloodBrotherObjectiveGroups
    maxDifficulty: 7.5
  - type: AntagSelection
    agentName: blood-brothers-round-end-agent-name
    selectionTime: IntraPlayerSpawn
    definitions:
    - prefRoles: [ BloodBrother ]
      max: 1
      playerRatio: 1
      briefing:
        text: blood-brother-initial-role-greeting
        color: MediumVioletRed
        sound: /Audio/_Harmony/Misc/blood_brother_greeting.ogg
      components:
      - type: BloodBrother
      - type: InitialBloodBrother
      mindRoles:
      - MindRoleBloodBrother

- type: entity
  parent: BaseGameRule
  id: Obsessed
  components:
  - type: GameRule
    minPlayers: 5
  - type: AntagSelection
    selectionTime: IntraPlayerSpawn
    agentName: obsessed-round-end-agent-name
    definitions:
    - prefRoles: [ Obsessed ]
      min: 1
      max: 2
      playerRatio: 20
      briefing:
        text: obsessed-role-greeting
        color: "#DEA0CA"
        sound: /Audio/_Harmony/Misc/obsessed_greeting.ogg
      mindRoles:
      - MindRoleObsessed
      startingGear: ObsessedGear
      multiAntagSetting: NotExclusive
  - type: AntagObjectives
    objectives:
    - ObsessedPhotoObjective
    - ObsessedIsolationObjective
    - ObsessedStealIdObjective
  - type: ObsessedRule

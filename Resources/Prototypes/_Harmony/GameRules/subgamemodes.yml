- type: entity
  parent: BaseGameRule
  id: BloodBrothers
  components:
  - type: BloodBrotherRule
  - type: AntagRandomObjectives
    sets:
    - groups: BloodBrotherObjectiveGroups
    maxDifficulty: 7.5
  - type: AntagSelection
    agentName: blood-brothers-round-end-agent-name
    selectionTime: PrePlayerSpawn
    antags:
    - !type:FixedAntagCount
      proto: BloodBrother
  - type: GameRule
    minPlayers: 10
    cancelPresetOnTooFewPlayers: false
    delay:
      min: 240
      max: 420

- type: entity
  parent: BaseGameRule
  id: Obsessed
  components:
  - type: GameRule
    minPlayers: 5
    cancelPresetOnTooFewPlayers: false
  - type: AntagSelection
    selectionTime: PrePlayerSpawn
    agentName: obsessed-round-end-agent-name
    lateJoinAdditional: true
    antags:
    - type: !LinearAntagCount
      proto: Obsessed
      playerRatio: 20
      range:
        min: 1
        max: 3
  - type: AntagObjectives
    objectives:
    - ObsessedPhotoObjective
    - ObsessedIsolationObjective
    - ObsessedStealIdObjective
    - ObsessedNearbyObjective
    - ObsessedAwaitConclusionObjective
  - type: ObsessedRule
